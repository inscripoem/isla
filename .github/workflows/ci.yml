name: CI

# Blocking gates (D7), enforced in code (ADR-006). Coverage:
#   G1  test approval    — a code/prompt pull request should carry the
#       tests-approved label; ADVISORY (reports, does not fail) until the team
#       enables enforcement — see docs/code-governance/g1-test-approval-proposal.md
#   G2  static analysis  — typecheck + lint on every commit
#   G3  schema + boundary — requirements registry validates; import/permission
#       boundaries hold (the readiness suite)
#   trace — traceability fitness functions (INV-13): a broken chain link fails
#   G5  regression       — every offline suite passes, zero regression
#   G6  AI-use log       — a code/prompt change must update docs/ai-use-log.yaml
#   G4  semantic eval    — not run without an evaluation set + provider access
#       (reported explicitly, never as a pass); fails a table that lacks the
#       fixed conditions NFR-01 requires
#   build                — production bundle
# Not covered here: the *timing* half of G1 (that the label was applied before the
# change) stays a review obligation, and branch protection is a human/remote
# setting. Live provider tests (test/live is intentionally empty) and real browser
# audio/VTS behaviour are out of scope. This workflow defines the gates; it does
# not assert that remote branch protection is configured. Only a human merge is
# permitted.

on:
  push:
  pull_request:
    # `labeled`/`unlabeled` are not in the default activity set; without them,
    # adding the `tests-approved` label would not re-run G1.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: changed files (the gate diff, acquired once)
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          # Resolve the range the gates review: the PR base, a push's `before`, or the
          # whole branch for a branch-creation push (merge-base with origin/main). An
          # unresolvable range fails here rather than reviewing a narrower diff; see
          # src/evaluation/change-range.ts.
          BASE="$(pnpm -s gate:change-base)"
          if ! git diff --name-only -z "$BASE" HEAD > .cache/changed-files.nul; then
            echo "::error::could not acquire the changed-file list ($BASE..HEAD); the diff gates are not verified"
            exit 1
          fi
          # NUL-separated all the way to the gates, so a path containing a space or a
          # newline stays one path.
          # The base copy of the log, so G6 can require the change to ADD an entry
          # rather than edit an existing one. The comparison is against where this
          # branch diverged, not the base branch tip: entries added to main after the
          # branch point are not this change's, and counting them could tie the count.
          # A log that did not exist at the base is an empty file: every entry is new.
          LOG_BASE="$(git merge-base "$BASE" HEAD || true)"
          if [ -z "$LOG_BASE" ]; then LOG_BASE="$BASE"; fi
          if git cat-file -e "$LOG_BASE:docs/ai-use-log.yaml" 2>/dev/null; then
            git show "$LOG_BASE:docs/ai-use-log.yaml" > .cache/ai-use-log.base.yaml
          else
            : > .cache/ai-use-log.base.yaml
          fi
          COUNT="$(tr -cd '\0' < .cache/changed-files.nul | wc -c | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "changed files: $COUNT"

      - name: G1 - test approval (advisory until the team enables it)
        id: g1
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CHANGED_FILES_FILE: .cache/changed-files.nul
        run: pnpm gate:test-approval advise

      - name: G2 - static analysis (typecheck + lint)
        id: g2
        run: pnpm typecheck && pnpm lint

      - name: G3 - requirements schema + import/permission boundaries
        id: g3
        run: pnpm test:readiness

      - name: trace - traceability fitness functions
        id: trace
        env:
          # The frozen-path check runs against the diff acquired above.
          CHANGED_FILES_FILE: .cache/changed-files.nul
        run: pnpm test:trace

      - name: G5 - regression (all offline suites)
        id: g5
        run: pnpm test

      - name: G6 - AI-use log updated for code/prompt changes
        id: g6
        env:
          CHANGED_FILES_FILE: .cache/changed-files.nul
          AI_USE_LOG_BASE_FILE: .cache/ai-use-log.base.yaml
        run: pnpm gate:ai-use-log

      - name: G4 - semantic evaluation (reported not run without an evaluation set)
        id: g4
        run: pnpm gate:eval

      - name: build
        id: build
        run: pnpm build

      - name: gate summary
        if: always()
        run: |
          {
            echo "## Gate summary"
            echo ""
            echo "Derived from each step's own outcome; the enforcement state in the label is the gate's documented design."
            echo ""
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| diff acquisition | ${{ steps.changed.outcome }} — ${{ steps.changed.outputs.count }} file(s) |"
            echo "| G1 test approval (advisory) | ${{ steps.g1.outcome }} |"
            echo "| G2 static analysis + boundary | ${{ steps.g2.outcome }} |"
            echo "| G3 requirements schema | ${{ steps.g3.outcome }} |"
            echo "| trace traceability fitness | ${{ steps.trace.outcome }} |"
            echo "| G5 regression | ${{ steps.g5.outcome }} |"
            echo "| G6 AI-use log | ${{ steps.g6.outcome }} |"
            echo "| G4 semantic eval (not run without an evaluation set) | ${{ steps.g4.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
