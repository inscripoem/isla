name: CI

# Coverage: frozen install, strict typecheck, lint, all offline tests (diagnostic
# boundary plus the M1-M6 role conformance kits, the offline composition runner,
# browser/backend import-boundary checks, contract schema checks and requirements
# registry/schema validation) and a production build.
# Not covered: live provider tests (test/live is intentionally empty), real browser
# audio/VTS/SQLite behavior, semantic evaluation and remote branch protection.
# This workflow defines CI; it does not assert that remote CI or branch protection
# is configured.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
