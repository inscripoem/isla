# An approval is the durable form of the `tests-approved` label: it names the
# tests that were agreed, the paths they cover, and when they were agreed. G1 in
# evidence mode requires the commit that added this file to be an ancestor of the
# first code commit in the pull request, so the record must be committed before
# implementation begins.
#
# What the gate proves: ordering. What it does not prove: that a human read the
# tests. That remains a review obligation (ADR-006 delta, 2026-11-13).
