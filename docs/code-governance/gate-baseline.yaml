# Expiry-dated exemptions for the evidence gates (Tier 1).
#
# A baseline entry is an admission, not a fix. It suppresses one *identified*
# violation until `expires`; on the first run after that date the gate fails again
# and the owning entry must be corrected or the exemption renewed with a recorded
# reason. Matching is by identity (kind + exact value), so a baseline cannot hide a
# different violation, and a removed value that returns later is still a violation.
#
# Owner: M6. Reviewed: 2026-11-13 with the gate implementation.
version: "1"
items:
