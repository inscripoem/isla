    value: "572c99c"
    expires: "2026-12-15"
    reason: "M4-03 (entry 110) cites a commit that is no longer an object; M4 owns the entry"
  - kind: commit
    value: "305656452dcf92106b911ad55b0223b420b6ec23"
    expires: "2026-12-15"
    reason: "M1-02-C-VTS-offline (entry 116) cites a commit that is no longer an object; M1 owns the entry"
  - kind: commit
