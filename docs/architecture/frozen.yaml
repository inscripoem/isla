# Frozen paths — the shared boundary.
#
# A change to any path listed here requires an architecture decision record and
# coordinated review by the affected owners (D3/D7; ADR-006). The traceability
# fitness function fails a pull request that modifies a frozen path with the
# `frozen-modified` violation, and fails if a listed path no longer exists
# (`frozen-path-missing`). Frozen is fail-closed: to change one, add an ADR and
# obtain human review.
frozen:
  - architecture-blueprint.md
  - src/contracts/app/ports.ts
  - src/contracts/app/storage.ts
