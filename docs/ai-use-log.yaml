  - date: "2026-10-19"
    task: M5-dynamic-audio-route
    change: >-
      The runtime now serves registered dynamic audio resources to same-origin
      browser consumers over one explicit route: `POST /audio?ref=...` with the
      `x-isla-audio-fetch` header. The route refuses a GET (405), a missing
      header (403), a missing or non-exact Origin (403; a browser POST supplies
      Origin itself, and a missing one is refused rather than admitted), a
      non-loopback Host (403), a missing or repeated ref (400), an unknown,
      retired or out-of-scope reference (404), a request whose session/epoch or
      serving lifecycle no longer matches (409), a disposed route (503) and an
      over-capacity route (429). The live identity is read from the authoritative
      composition on every request and again after the resolver settles and
      after the body is acquired: it carries the session id, the epoch and a
      `servable` flag computed from the coordinator lifecycle (`running` only,
      excluding the initial stopped composition, stopped, degraded and retiring
      states), so a Stop, retirement, recovery or degradation during acquisition
      cannot publish stale audio even when the epoch is unchanged. The serving
      slot and the resource lease are held until the response finishes, closes or
      errors; a release requested before a late resolver settlement is applied
      when that lease arrives, so a non-cooperating resolver still releases
      exactly once; route disposal aborts the acquisition and terminates every
      still-open response instead of waiting forever for completion. The
      application endpoint takes an optional `audioSource`; the production peer
      set widens `audioResources` to `ProductionAudioResources` (retirement plus
      `admission`/`resolve`) and validates all four methods; the root Vite entry
      proxies `/audio` to the runtime. M2's `AudioResolver.resolve(audioRef,
      signal)` consumer seam is unchanged.
