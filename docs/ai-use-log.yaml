  - date: "2026-10-18"
    task: I1-01-session-recovery
    branch: feat/i1-session-recovery
    change: >-
      Add explicit operator session recovery to the protocol-0.2 application endpoint
      and the I1 loop. A `session.recover` client message (payload
      `acknowledgePlaybackEnded: true`, the operator's own decision and never media
      or delivery evidence) retires the old in-memory scheduling and every old
      connection, installs a fresh stopped successor with a new epoch, its own
      deadline gate and the same backing store, and carries forward only confirmed
      history through the existing production reconstruction entry. A new
      `SessionRecovery` controller owns the selection lineage and the
      retire/install state machine; retries and concurrent requests resolve to a
      single successor; unknown and partial outcomes are preserved but never
      promoted to speech; the archive-source bound stays explicit; and a
      successor-construction failure is a retryable refusal that leaves the retiring
      session current without a second live runtime. The server also pushes an
      explicit `session.recovery.state` (`retiring: true`) to every client,
      including after a reload, so the page's retired state is server-authoritative
      rather than inferred from lifecycle. The change is additive at protocol 0.2;
      no shared register row or case id was added and the existing C-08 row stays
      pending with no verifier.
