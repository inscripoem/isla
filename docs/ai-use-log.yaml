  - date: "2026-10-19"
    task: M5-production-shutdown-boundary
    branch: feat/m5-production-composition
    change: >-
      Repair the production shutdown boundary after the unchanged independent
      probe showed a cancelled turn writing `result.stale` into a finalized
      SQLite statement and reporting `storageFailure: true`. `settle()` is now a
      two-phase controlled drain: it seals operation admission, drains every
      admitted bounded operation to its terminal bookkeeping (the active turn's
      aborted provider calls and stale result, an in-flight receipt
      finalization), then seals writes and awaits the serialized write chain, so
      a late raw-provider callback is refused without storage access instead of
      racing the close. `disposeSession()` releases a playback wait that can no
      longer receive terminal evidence; `stop()` marks shutdown synchronously,
      stops the transport, drains recorded recovery builds, disposes every
      composition and settles every coordinator inside a `finally` before
      closing the handle; a recovery build racing shutdown is refused as
      `construction_failed` without a store read; and a creation failure
      disposes the built compositions and closes the handle. An intermediate
      immediate write seal that dropped the already-invoked provider attempt was
      rejected by supervising review and corrected. The composition comments now
      state the actual `synthesis`/`audioEntries` contract (at least one is
      required; `synthesis` takes precedence when both are supplied).
      Regressions: the held cancellation-ignoring selector is invoked exactly
      once, its `provider.call` (`disposition: aborted`) and `result.stale`
      survive stop and a real SQLite reopen, and release after stop performs no
      store access and admits no delivery; a held `output.receipt` append keeps
      stop pending and the receipt and `delivery.committed` drain durably; a
      held successor preflight drains, the late successor is retired and a later
      recovery is refused without a store read; an invalid `allowedHosts` entry
      fails construction after the initial build and the cleanup retires that
      composition without a WAL. The M5 session-recovery integration assertion was adapted
      so old evidence must remain an unchanged prefix while retirement may only
      append the interrupted turn's bounded cancellation bookkeeping, and that
      bookkeeping must be truthful: exactly one terminal turn record and it is
      `cancelled`, every appended provider call is `aborted`, and no delivery or
      completed receipt is admitted by retirement. The root Vite entry
      (`vite.config.ts`) now forwards `/app` (WebSocket) and `/operator` (HTTP)
      to the runtime alongside `/health` and `/diag`; the proxy forwards the
      original `Origin` and `Host`, so the runtime's own origin/host checks still
      decide, and M2 keeps the console UI.
    requirements: [FR-05, FR-06]
