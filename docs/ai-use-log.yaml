  - date: 2026-10-21
    task: M4-03
    branch: feat/m4-03
    change: >-
      Memory quality for the dialogue context, in three independently
      revertible parts. Recall (memory-recall.ts) replaces one English-only
      stopword list with per-tokenizer tables - whole Latin words, CJK bigrams,
      and a CJK glue-character table - because an English list never matched
      Chinese text; a one-character CJK run now yields no token at all, and
      tokens are weighted by information content (a 5+ character Latin word, a
      number, or a bigram of two content characters scores 2, every other token
      1). A candidate must reach MIN_RECALL_SCORE and share at least one
      informative token, so two shared glue words can no longer recall an
      unrelated old turn on their own. Salience (salience.ts) replaces the
      concrete-detail signal that scored ANY digit with three number shapes - a
      date or clock time, a quantity with a unit, a multi-digit identifier - so a
      bare single digit no longer pins a turn, and widens the promise,
      preference and identity cues with the Chinese emphasis a Chinese listener
      actually uses (千万要, 务必, 别再忘了, 说好了, 最喜欢, 我的生日); a bare 一定
      is not a promise, a bare time word is not a detail, and
      SALIENCE_PIN_THRESHOLD, MAX_PINNED_TURNS and the signal weights are
      unchanged. The new consistency.ts compares admitted confirmed clauses and
      the profile's standing facts before the prompt is rendered, reporting
      negation, incompatible-quantity and opposite-attribute disagreements as
      audit findings that carry statement ids, the evidence kind and a
      shared-token count but never statement text. It is audit only: nothing is
      rewritten, deleted, re-admitted or re-budgeted, and the optional
      [conflicting] prompt marker is off by default because it spends character
      budget. No shared C1-C7 contract, storage schema, requirement definition or
      invariant definition changed.
