  - date: "2026-10-19"
    task: M5-dynamic-audio-acceptance-boundaries
    change: >-
      Added four boundary acceptance tests to the dynamic audio route suite and
      made the browser acceptance script portable. Route mechanics now prove
      that invalidation while `Blob.arrayBuffer()` is pending refuses 409 and
      releases the lease exactly once, and that an early-disconnected resolver
      which ignores abort keeps its serving slot until it settles (a further
      request is 429 `busy`, and the slot frees only on settlement). Through the
      actual application, the suite now proves that a real storage fault (the
      event table renamed on the live SQLite database) degrades the running
      session without an epoch change while an acquisition is held, so the held
      request is refused 409, its lease releases exactly once and the reference
      is reclaimed; and that operator recovery during a held acquisition refuses
      the old bytes, releases the lease exactly once, leaves the retired
