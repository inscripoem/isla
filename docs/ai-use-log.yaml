    change: >-
      Add the M5 production composition and durable application lifecycle on the
      published PR45 head 6bcfc2b. `src/runtime/production.ts` owns one shared
      SQLite handle, the M6 store and history view over it, the operator session
      recovery controller and the loopback server; every composition (the initial
