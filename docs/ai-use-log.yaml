      shutdown on SIGINT/SIGTERM. `src/runtime/composition.ts` accepts an injected
      `synthesis` port (supplying neither `synthesis` nor `audioEntries` is an
      explicit `TypeError`) and an optional `CompositionAudioResources` seam whose
      `retireBefore`/`retireSession` calls are isolated so a throwing registry
      cannot break Stop or disposal. `src/runtime/coordinator.ts` gains
      `settle(): Promise<void>` over the serialized write chain. Tests cover peer
      validation, pre-storage rejection, audio retirement, durable close/reopen
      with confirmed archives and a partial-unknown null-persona archive,
      `live_session_not_fresh` refusal without a leaked WAL file, stop-before-start,
